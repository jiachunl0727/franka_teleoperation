# Actuator limits remain enforced even with CBF disabled. Fractions of Panda
# FCI ceilings: [87,87,87,87,12,12,12] Nm and 1000 Nm/s. Restart to apply edits.
cbf:
  # Background QP; each callback verifies/repairs locally and never waits for it.
  execution: asynchronous
  worker_period_ms: 5.0
  maximum_result_age_ms: 50.0
  maximum_worker_state_age_ms: 20.0
  maximum_peer_age_ms: 10.0
  maximum_worker_skew_ms: 5.0
  recovery_dwell_ms: 100.0
  model_grace_ms: 3.0
  braking_acceleration: 2.0       # rad/s^2, desired fallback joint deceleration
  fallback_hold_stiffness: 120.0  # Nm/rad
  fallback_hold_damping: 22.0     # Nm s/rad
  guard_clearance_reserve: 0.005  # m, additional local-model reserve
  peer_motion_bound_mps: 22.0     # m/s, displacement reserve for peer-state age
  # Active only when the overall CBF is enabled; thresholds need commissioning.
  singularity_enabled: true
  singularity_minimum_manipulability: 0.05  # sqrt(det(Js Js^T)), dimensionless
  singularity_characteristic_length: 0.3   # m; Js linear rows = J_linear / length
  singularity_cbf_frequency: 8.0           # s^-1, critically damped barrier
  torque_limit_scale: 0.35       # -> [30.45,30.45,30.45,30.45,4.2,4.2,4.2] Nm
  torque_rate_limit_scale: 0.35  # -> 350 Nm/s (0.35 Nm per 1 ms cycle)
  # Mandatory shared world-z plane, active even when the optional CBF is off.
  table_height: 0.0
  table_minimum_clearance: 0.02
  self_minimum_clearance: 0.03
  inter_arm_minimum_clearance: 0.05
  maximum_failures: 20
arm_settings: {}
