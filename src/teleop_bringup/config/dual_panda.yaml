# Dual-Panda template. Pass this path explicitly as runtime_config.
# Both left/right assignments come from `arms`; there is no single-hand selector.
# Hardware needs distinct robot_ip values and operator_confirm:=true.
# Enabled Hands perform empty-hand startup calibration; release grip stops closing.
pipeline:
  mode: dual
  backend: hardware
  start_bridge: true
  start_mapper: true
  start_controller: true
  start_hand: true
  homing_enabled: true
  recording_enabled: true
  mock_measured_pose: false
quest:
  bridge:
    namespace: /
    listen_port: 45454
    bind_address: 127.0.0.1
    command_timeout_ms: 100
    max_clock_uncertainty_ms: 10
    max_clock_sync_age_ms: 3000
    max_source_future_ms: 10
    client_receive_timeout_ms: 500
arms:
  panda_left:
    robot_ip: 192.168.3.109
    namespace: /panda_left
    base_frame: panda_left/panda_link0
    controller: left
    command_topic: cartesian_teleop_command
    target_pose_topic: target_pose
    measured_pose_topic: teleop_anchor_pose
    state_topic: robot_state
    reference_to_robot_xyzw: [0.5, 0.5, 0.5, 0.5]
    translation_scale: 0.75
    rotation_scale: 0.33
    feedforward_scale: 0.5
    twist_filter_cutoff_hz: 10.0
    # Independent mapped pose and velocity processing: none, low_pass, four_pole.
    pose_filter: none
    velocity_filter: low_pass
    pose_filter_cutoff_hz: 5.0
    velocity_filter_cutoff_hz: 5.0
    # Interpolation: none, ptp_polynomial (septic), spline (quintic).
    pose_interpolation: none
    velocity_interpolation: none
    pose_interpolation_duration_ms: 40.0
    velocity_interpolation_duration_ms: 40.0
    command_timeout_ms: 100
    max_clock_uncertainty_ms: 10.0
    max_source_future_ms: 10.0
    min_derivative_dt_ms: 1.0
    max_derivative_dt_ms: 100.0
    trigger_engage: 0.75
    trigger_release: 0.25
  panda_right:
    robot_ip: 192.168.3.101
    namespace: /panda_right
    base_frame: panda_right/panda_link0
    controller: right
    command_topic: cartesian_teleop_command
    target_pose_topic: target_pose
    measured_pose_topic: teleop_anchor_pose
    state_topic: robot_state
    reference_to_robot_xyzw: [0.5, 0.5, 0.5, 0.5]
    translation_scale: 0.75
    rotation_scale: 0.33
    feedforward_scale: 0.5
    twist_filter_cutoff_hz: 10.0
    # Independent mapped pose and velocity processing (none, low_pass, four_pole).
    pose_filter: none
    velocity_filter: low_pass
    pose_filter_cutoff_hz: 10.0
    velocity_filter_cutoff_hz: 10.0
    # Interpolation: none, ptp_polynomial (septic), spline (quintic).
    pose_interpolation: none
    velocity_interpolation: none
    pose_interpolation_duration_ms: 40.0
    velocity_interpolation_duration_ms: 40.0
    command_timeout_ms: 100
    max_clock_uncertainty_ms: 10.0
    max_source_future_ms: 10.0
    min_derivative_dt_ms: 1.0
    max_derivative_dt_ms: 100.0
    trigger_engage: 0.75
    trigger_release: 0.25
controller:
  # Local post-controller clipping, independent of any future safety filter.
  torque_limit_scale: 0.35
  torque_rate_limit_scale: 0.35
  # Shared by homing and the nullspace posture preference; radians, Panda joint order.
  home_joint_position: [0.0, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854]
  nullspace_enabled: true
  nullspace_stiffness: 10.0          # Nm/rad
  nullspace_damping: 6.324555320336759  # Nm s/rad
  nullspace_joint_limit_gain: 2.0    # Nm, soft repulsion for nominal posture preference
  nullspace_joint_limit_margin: 0.35  # rad
  nullspace_max_torque: 5.0         # Nm; uniform scaling retains the projection
  nullspace_ramp_seconds: 0.25
  # Optional controller limits, independent of CBF. Disabled by default.
  reference_shaping_enabled: false
  tracking_protection_enabled: false
  cartesian_wrench_limits_enabled: false
  # These positive values apply only when their corresponding switch is enabled.
  reference_linear_speed: 0.05
  reference_angular_speed: 0.15
  reference_linear_acceleration: 0.15
  reference_angular_acceleration: 0.5
  tracking_position_limit: 0.03
  tracking_orientation_limit: 0.2
  cartesian_force_limit: 10.0
  cartesian_moment_limit: 1.5
  lambda_translation: 15.0
  lambda_rotation: 15.0
  gain_translation: 50.0
  gain_rotation: 5.0
  # Release trigger: capture measured joints once and hold the whole arm.
  hold_stiffness: [600.0, 600.0, 600.0, 600.0, 250.0, 150.0, 75.0]  # Nm/rad
  hold_damping: [50.0, 50.0, 50.0, 50.0, 20.0, 15.0, 10.0]        # Nm s/rad
  hold_stiffness_ramp_seconds: 0.25
  maximum_torque_rate: 900.0
  torque_limits: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]
  tool_offset_m: 0.1034
  envelope_margin_m: 0.001
  envelope_center: [0.0, 0.0, 0.333]
  homing_speed_factor: 0.15
  homing_timeout_seconds: 30.0
  homing_stop_duration_seconds: 0.5
  homing_stop_acceleration: 0.75
  homing_stop_timeout_seconds: 5.0
  homing_stiffness: [300.0, 300.0, 300.0, 300.0, 120.0, 100.0, 50.0]
  homing_damping: [30.0, 30.0, 30.0, 30.0, 10.0, 10.0, 5.0]
hand:
  # Right: left closes/right opens. Left: right closes/left opens.
  # Stick direction selects fixed speed; neutral stops unfinished movement.
  joystick_engage: 0.4
  joystick_neutral: 0.2
  close_width_m: 0.0
  cable_diameter_m: 0.005             # Expected cable gap; edit for the actual cable.
  cable_diameter_tolerance_m: 0.002   # Acceptable compressed gap +/- this value.
  grasp_force_n: -1.0                # REQUIRED: set a positive force in N; -1 disables closing.
  worker_poll_ms: 1.0
  open_speed_mps: 0.1
  speed_mps: 0.05
  open_width_m: 0.025
  command_timeout_ms: 100.0
  max_clock_uncertainty_ms: 10.0
  mock_operation_duration_ms: 100.0
recording:
  mode: menu
  namespace: /quest
  left_controller_state_topic: ''
  menu_debounce_seconds: 0.35
  include_default_topics: true
  topics: []
  output_root: /ws/log/quest_bags
  storage_id: sqlite3
