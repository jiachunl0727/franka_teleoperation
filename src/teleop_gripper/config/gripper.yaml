hand:
  open_width_m: -1.0  # -1 uses the calibrated maximum opening.
  # Right: left closes/right opens. Left: right closes/left opens.
  # Stick direction selects fixed speed; neutral stops unfinished movement.
  joystick_engage: 0.4
  joystick_neutral: 0.2
  close_width_m: 0.0
  cable_diameter_m: 0.005             # Expected cable gap; edit for the actual cable.
  cable_diameter_tolerance_m: 0.002   # Acceptable compressed gap +/- this value.
  grasp_force_n: -1.0                # REQUIRED: set a positive force in N; -1 disables closing.
  worker_poll_ms: 1.0
  open_speed_mps: 0.1
  speed_mps: 0.02
  mock_object_width_m: 0.0  # Mock only: zero is empty; set e.g. .005 to simulate a cable.
arm_settings: {}
