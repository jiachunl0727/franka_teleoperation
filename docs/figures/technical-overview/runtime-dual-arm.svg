<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="689" viewBox="0 0 1000 689" role="img" aria-labelledby="title desc">
  <title id="title">Dual-arm teleoperation runtime</title>
  <desc id="desc">The Quest app sends input over USB to a shared bridge. The two arm namespaces run in one ROS 2 container. Recording is shared, and the arm controllers optionally exchange collision geometry inside one process.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#405b70"/>
    </marker>
  </defs>
  <style>
    text{font:17px Arial,sans-serif;fill:#17314a;text-anchor:middle}
    .label{font-weight:bold}.small{font-size:15px}
    .flow,.record,.peer{fill:none;stroke:#405b70;stroke-width:2;marker-end:url(#arrow)}
    .record{stroke-dasharray:7 5}.peer{stroke-dasharray:2 5;marker-start:url(#arrow)}
  </style>
  <rect width="1000" height="689" fill="white"/>
  <rect x="40" y="102" width="920" height="430" rx="16" fill="#f5f9fc" stroke="#91a9bb"/>
  <text x="122" y="132" class="label">ROS 2 container</text>
  <rect x="392" y="20" width="216" height="42" rx="9" fill="#e3eff7"/>
  <text x="500" y="47" class="label">Quest 3 app</text>
  <path d="M500 62V147" class="flow"/>
  <text x="552" y="87" class="small">USB via ADB</text>
  <rect x="392" y="147" width="216" height="44" rx="9" fill="#dcecf7"/>
  <text x="500" y="175" class="label">Quest USB bridge</text>
  <rect x="755" y="147" width="162" height="44" rx="9" fill="#e7eef3"/>
  <text x="836" y="175" class="label">rosbag2 recorder</text>
  <path d="M608 169H755" class="record"/>
  <text x="682" y="158" class="small">Quest input</text>
  <rect x="82" y="227" width="333" height="253" rx="12" fill="#eaf3f9" stroke="#adc1d0"/>
  <rect x="585" y="227" width="333" height="253" rx="12" fill="#eaf3f9" stroke="#adc1d0"/>
  <path d="M500 191V211H248V227" class="flow"/>
  <path d="M500 211H752V227" class="flow"/>
  <text x="248" y="254" class="label">/panda_left</text>
  <text x="752" y="254" class="label">/panda_right</text>
  <rect x="133" y="265" width="230" height="35" rx="8" fill="#f7fbff" stroke="#adc1d0"/>
  <text x="248" y="288">pose mapper · hand worker</text>
  <rect x="637" y="265" width="230" height="35" rx="8" fill="#f7fbff" stroke="#adc1d0"/>
  <text x="752" y="288">pose mapper · hand worker</text>
  <rect x="107" y="311" width="786" height="121" rx="10" fill="#fff4df" stroke="#b5a178"/>
  <text x="500" y="335" class="label">Shared arm controller process</text>
  <rect x="133" y="357" width="230" height="52" rx="8" fill="#fffaf0" stroke="#b5a178"/>
  <rect x="637" y="357" width="230" height="52" rx="8" fill="#fffaf0" stroke="#b5a178"/>
  <text x="248" y="389">robot controller · safety filter</text>
  <text x="752" y="389">robot controller · safety filter</text>
  <path d="M248 300V357" class="flow"/>
  <path d="M752 300V357" class="flow"/>
  <path d="M372 387H628" class="peer"/>
  <text x="500" y="375" class="small">collision geometry for</text>
  <text x="500" y="410" class="small">inter-arm collision avoidance</text>
  <path d="M316 409V500H684V409" class="record" style="marker-end:none"/>
  <path d="M684 500H744" class="record" style="marker-end:none"/>
  <path d="M760 500H939V169H917" class="record"/>
  <text x="500" y="520" class="small">Robot telemetry</text>
  <path d="M248 409V567" class="flow"/>
  <path d="M752 409V567" class="flow"/>
  <rect x="135" y="567" width="226" height="44" rx="9" fill="#e8edf0"/>
  <rect x="639" y="567" width="226" height="44" rx="9" fill="#e8edf0"/>
  <text x="248" y="595" class="label">Left Panda and Hand</text>
  <text x="752" y="595" class="label">Right Panda and Hand</text>
  <path d="M125 657H178" class="flow"/>
  <text x="247" y="663" class="small">Control path</text>
  <path d="M388 657H441" class="record"/>
  <text x="506" y="663" class="small">Recording</text>
  <path d="M644 657H697" class="peer"/>
  <text x="804" y="663" class="small">Geometry exchange</text>
</svg>
